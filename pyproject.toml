[project]
name = "async-event-bus"
version = "1.0.0"
description = "A simple and modular async event bus for Python 3.12+"
authors = [
    { name = "Half_nothing", email = "Half_nothing@163.com" },
]
dependencies = [
    "loguru>=0.7.3"
]
requires-python = "<4.0,>=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "python",
    "event-bus",
    "async",
    "asyncio",
    "events",
    "pubsub",
    "event-driven",
    "middleware",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/half-nothing/async-event-bus"
Repository = "https://github.com/half-nothing/async-event-bus"
Documentation = "https://github.com/half-nothing/async-event-bus#readme"
Issues = "https://github.com/half-nothing/async-event-bus/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit src-layout package discovery.
[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 type stubs (.pyi) and the py.typed marker inside the wheel
# so that type checkers get a precise, implementation-independent public API
# contract.
[tool.setuptools.package-data]
"async_event_bus" = ["**/*.pyi", "py.typed"]

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "setuptools>=80.9.0",
    "pytest>=8.4.1",
    "pytest-html>=4.1.1",
    "pytest-asyncio>=1.1.0",
]
